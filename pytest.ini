[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --alluredir=allure-results --screenshot=only-on-failure --tracing=retain-on-failure --junitxml=reports/junit.xml
markers =
    e2e: live end-to-end tests against ebay.com
    unit: fast offline unit tests
log_cli = true
log_cli_level = INFO
