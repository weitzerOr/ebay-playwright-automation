name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -m unit

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-allure-results
          path: allure-results
          if-no-files-found: ignore

  e2e:
    name: eBay e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Live ebay.com often blocks GitHub-hosted IPs / automation. Unit tests remain the merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium and xvfb
        run: |
          playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run e2e tests
        env:
          HEADLESS: "false"
          BROWSER_CHANNEL: ""
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" pytest -m e2e

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-results
          path: |
            allure-results
            reports
          if-no-files-found: ignore
